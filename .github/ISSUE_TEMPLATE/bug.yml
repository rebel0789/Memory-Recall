name: Bug report
description: Reproducible defect in implemented behavior
title: "bug: "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes: { label: Version or commit }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction, description: Include exact commands and synthetic data only. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected and actual behavior }
    validations: { required: true }
  - type: textarea
    id: security
    attributes: { label: Security or data impact, description: Do not disclose vulnerabilities publicly. }
