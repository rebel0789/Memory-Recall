name: Publish npm
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish from package.json
        required: true
        type: string
      confirm:
        description: Type publish open-agent-fabric@VERSION
        required: true
        type: string
      auth_mode:
        description: npm authentication mode
        required: true
        default: trusted-publishing
        type: choice
        options:
          - trusted-publishing
          - npm-token
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: npm-release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g npm@latest
      - name: Validate manual confirmation
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          ACTUAL_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          EXPECTED_CONFIRM="publish open-agent-fabric@${ACTUAL_VERSION}"
          if [ "$INPUT_VERSION" != "$ACTUAL_VERSION" ]; then
            echo "Input version $INPUT_VERSION does not match package.json version $ACTUAL_VERSION" >&2
            exit 1
          fi
          if [ "$INPUT_CONFIRM" != "$EXPECTED_CONFIRM" ]; then
            echo "Confirmation must exactly match: $EXPECTED_CONFIRM" >&2
            exit 1
          fi
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run ci
      - run: npm run native:smoke
      - run: npm run consumer:smoke
      - run: npm run release:readiness:check
      - run: npm publish --access public --dry-run
      - name: Publish with npm Trusted Publishing
        if: ${{ inputs.auth_mode == 'trusted-publishing' }}
        run: npm publish --access public
      - name: Publish with NPM_TOKEN fallback
        if: ${{ inputs.auth_mode == 'npm-token' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
